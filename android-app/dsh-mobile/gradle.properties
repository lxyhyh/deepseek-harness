# 项目级 Gradle 配置
# 沙箱 cgroup 内存上限 4G：压低各 JVM 堆，避免大资产打包时被 OOM 杀掉
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=1
# 使用 AndroidX
android.useAndroidX=true
# 按官方建议使用非传递 R 类
android.nonTransitiveRClass=true
# 用 JDK 17 运行 Gradle（与方案首推组合 AGP 8.7.2 + Gradle 8.9 + JDK 17 一致）
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
# 沙箱网络必须走本地代理 18080，否则 Gradle 直连外网会卡在 TCP 握手
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
